<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Saiket Systems – Task 6 clones: Duolingo, Pixabay, Stripe" />
  <title>Task 6 – Webpage Clones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0d16;--surface:#111827;--border:rgba(255,255,255,0.07);--accent:#6366f1;--text:#f1f5f9;--muted:#94a3b8}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh}
    h1{font-size:2.2rem;margin-bottom:1rem;color:var(--accent)}
    .grid{display:grid;gap:20px;max-width:800px;width:100%}
    a{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-decoration:none;color:var(--text);transition:0.3s;display:block}
    a:hover{border-color:var(--accent);box-shadow:0 8px 20px rgba(99,102,241,0.2)}
    .title{font-weight:600;margin-bottom:8px}
    footer{margin-top:auto;padding:20px;font-size:0.85rem;color:var(--muted)}
  </style>
</head>
<body>
  <h1>Task 6 – Webpage Clones</h1>
  <div class="grid">
    <a href="Duolingo/">
      <div class="title">Duolingo Clone</div>
      <p>Interactive language‑learning landing page recreation.</p>
    </a>
    <a href="Pixabay/">
      <div class="title">Pixabay Clone</div>
      <p>Image‑search portal with grid layout and hover effects.</p>
    </a>
    <a href="Stripe/">
      <div class="title">Stripe Clone</div>
      <p>Payment‑service landing page with sleek typography.</p>
    </a>
  </div>
  <footer>
    <p>© 2026 Saiket Systems – Front‑End Task Portfolio</p>
  </footer>
</body>
</html>
